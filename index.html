<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before Keys — Next-Gen Social Agency for New Build Real Estate</title>
  <meta name="description" content="Before Keys — a next-gen social agency for new build real estate projects. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1ec;
      --ink: #1a1a18;
      --ink-light: #3a3a36;
      --ink-mid: #6a6a64;
      --ink-faint: #b0ada6;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ---- HALFTONE CANVAS ---- */
    canvas#halftone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ---- MAIN CONTENT ---- */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    /* ---- 3D GLASS BOX with orbiting text ---- */
    .glass-box {
      position: relative;
      width: clamp(200px, 42vw, 320px);
      height: clamp(200px, 42vw, 320px);
      margin-bottom: clamp(16px, 3vh, 36px);
      perspective: 800px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.2s;
    }

    /* The 3D scene container */
    .glass-scene {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Glass panels — front and back */
    .glass-panel {
      position: absolute;
      inset: 10%;
      border-radius: 16px;
      border: 1px solid rgba(26, 26, 24, 0.08);
    }

    .glass-panel.front {
      transform: translateZ(60px);
      background: rgba(244, 241, 236, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 3;
      box-shadow: 0 0 30px rgba(26, 26, 24, 0.03);
    }

    .glass-panel.back {
      transform: translateZ(-60px);
      background: rgba(244, 241, 236, 0.15);
      z-index: 0;
    }

    /* Key icon — centered in the glass box, in front of glass */
    .key-icon-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(70px);
      z-index: 4;
      perspective: 600px;
    }

    .key-icon {
      width: clamp(120px, 28vw, 180px);
      height: clamp(120px, 28vw, 180px);
      animation: spin3d 4s linear infinite;
      transform-style: preserve-3d;
    }

    @keyframes spin3d {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    /* ---- ORBITING TEXT (3D orbit around box) ---- */
    .orbit-container {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: orbit3d 12s linear infinite;
    }

    @keyframes orbit3d {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    /* Each text element is placed around the orbit ring */
    .orbit-word {
      position: absolute;
      top: 50%;
      left: 50%;
      font-family: 'Space Mono', monospace;
      font-size: clamp(7px, 1.2vw, 10px);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      transform-style: preserve-3d;
      backface-visibility: visible;
    }

    /* Position words around a 3D circle */
    .orbit-word:nth-child(1) {
      transform: translate(-50%, -50%) rotateY(0deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(2) {
      transform: translate(-50%, -50%) rotateY(45deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(3) {
      transform: translate(-50%, -50%) rotateY(90deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(4) {
      transform: translate(-50%, -50%) rotateY(135deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(5) {
      transform: translate(-50%, -50%) rotateY(180deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(6) {
      transform: translate(-50%, -50%) rotateY(225deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(7) {
      transform: translate(-50%, -50%) rotateY(270deg) translateZ(clamp(120px, 24vw, 190px));
    }
    .orbit-word:nth-child(8) {
      transform: translate(-50%, -50%) rotateY(315deg) translateZ(clamp(120px, 24vw, 190px));
    }

    /* ---- BRAND ---- */
    .brand {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 4.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: clamp(4px, 0.8vh, 8px);
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.4s;
      position: relative;
    }

    .brand::after {
      content: '';
      display: block;
      width: 100%;
      height: 3px;
      margin-top: 6px;
      background: repeating-linear-gradient(
        to right,
        var(--ink) 0px, var(--ink) 3px,
        transparent 3px, transparent 6px
      );
    }

    /* ---- TAGLINE ---- */
    .tagline {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: clamp(0.45rem, 1.2vw, 0.72rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: clamp(16px, 3vh, 40px);
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.6s;
    }

    /* ---- HALFTONE DIVIDER ---- */
    .halftone-divider {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: clamp(16px, 3vh, 40px);
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.7s;
    }

    .halftone-divider span {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink);
    }

    .halftone-divider span:nth-child(1) { opacity: 0.15; width: 3px; height: 3px; }
    .halftone-divider span:nth-child(2) { opacity: 0.25; width: 3px; height: 3px; }
    .halftone-divider span:nth-child(3) { opacity: 0.35; }
    .halftone-divider span:nth-child(4) { opacity: 0.5; }
    .halftone-divider span:nth-child(5) { opacity: 0.65; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(6) { opacity: 0.8; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(7) { opacity: 1; width: 6px; height: 6px; }
    .halftone-divider span:nth-child(8) { opacity: 0.8; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(9) { opacity: 0.65; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(10) { opacity: 0.5; }
    .halftone-divider span:nth-child(11) { opacity: 0.35; }
    .halftone-divider span:nth-child(12) { opacity: 0.25; width: 3px; height: 3px; }
    .halftone-divider span:nth-child(13) { opacity: 0.15; width: 3px; height: 3px; }

    /* ---- DESCRIPTION ---- */
    .description {
      font-size: clamp(0.75rem, 1.8vw, 1.05rem);
      font-weight: 300;
      line-height: 1.65;
      color: var(--ink-light);
      max-width: 420px;
      margin-bottom: clamp(16px, 3vh, 40px);
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.85s;
    }

    .description strong {
      font-weight: 500;
      color: var(--ink);
    }

    .cipher-char {
      display: inline-block;
      min-width: 0.25em;
    }

    /* ---- UNDER CONSTRUCTION ---- */
    .construction-wrap {
      position: relative;
      margin-bottom: clamp(12px, 2.5vh, 36px);
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1s;
    }

    .construction {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: clamp(8px, 1.5vh, 16px) clamp(16px, 3vw, 36px);
      border: 1.5px solid var(--ink);
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.5rem, 1vw, 0.7rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .construction::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(26, 26, 24, 0.06) 40%,
        rgba(26, 26, 24, 0.12) 50%,
        rgba(26, 26, 24, 0.06) 60%,
        transparent 100%
      );
      animation: scanLine 3s ease-in-out infinite;
    }

    @keyframes scanLine {
      0%   { left: -100%; }
      100% { left: 100%; }
    }

    .construction .corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--ink);
      border-style: solid;
      border-width: 0;
    }

    .construction .corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
    .construction .corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
    .construction .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
    .construction .corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

    .construction .cursor-block {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--ink);
      animation: cursorBlink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .construction-dots {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .construction-dots.left { right: calc(100% + 12px); }
    .construction-dots.right { left: calc(100% + 12px); }

    .construction-dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink);
    }

    .construction-dots span:nth-child(1) { opacity: 0.15; }
    .construction-dots span:nth-child(2) { opacity: 0.4; }
    .construction-dots span:nth-child(3) { opacity: 0.7; }
    .construction-dots span:nth-child(4) { opacity: 0.4; }
    .construction-dots span:nth-child(5) { opacity: 0.15; }

    /* ---- CONTACT ---- */
    .contact {
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1.1s;
      margin-bottom: clamp(8px, 1.5vh, 16px);
    }

    .contact a {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.65rem, 1vw, 0.78rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 3px;
      transition: opacity 0.3s ease;
    }

    .contact a:hover {
      opacity: 0.6;
    }

    /* ---- FOOTER DOTS ---- */
    .footer-dots {
      display: flex;
      gap: 8px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1.2s;
    }

    .footer-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.2;
    }

    .footer-dots span:nth-child(2) { opacity: 0.35; }
    .footer-dots span:nth-child(3) { opacity: 0.5; animation: blink 3s ease-in-out infinite; }
    .footer-dots span:nth-child(4) { opacity: 0.35; }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes dotFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---- MOBILE ---- */
    @media (max-width: 520px) {
      .page {
        padding: 16px;
      }

      .construction-dots { display: none; }
    }

    /* Short viewports (landscape phones etc) */
    @media (max-height: 650px) {
      .glass-box {
        width: 160px;
        height: 160px;
        margin-bottom: 12px;
      }

      .key-icon {
        width: 90px !important;
        height: 90px !important;
      }

      .glass-panel {
        border-radius: 10px;
      }

      .brand {
        font-size: 1.4rem;
      }

      .description {
        font-size: 0.72rem;
        margin-bottom: 12px;
      }

      .construction-wrap {
        margin-bottom: 12px;
      }

      .construction-dots { display: none; }
    }
  </style>
</head>

  <script>
    // ---- HALFTONE DOT BACKGROUND ----
    const canvas = document.getElementById('halftone');
    const ctx = canvas.getContext('2d');
    let w, h, cols, rows;
    const GRID = 18;
    const INK = [26, 26, 24];
    let mouse = { x: -1000, y: -1000 };
    let time = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(w / GRID) + 1;
      rows = Math.ceil(h / GRID) + 1;
    }

    function draw() {
      time += 0.003;
      ctx.clearRect(0, 0, w, h);

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * GRID;
          const y = row * GRID;

          const cx = w / 2;
          const cy = h / 2;
          const dx = x - cx;
          const dy = y - cy;
          const distCenter = Math.sqrt(dx * dx + dy * dy);
          const maxDist = Math.sqrt(cx * cx + cy * cy);

          const ringPhase = distCenter * 0.02 + time;
          const ringWave = Math.sin(ringPhase) * 0.5 + 0.5;

          const mdx = x - mouse.x;
          const mdy = y - mouse.y;
          const mouseDist = Math.sqrt(mdx * mdx + mdy * mdy);
          const mouseInfluence = Math.max(0, 1 - mouseDist / 150);

          const edgeFade = distCenter / maxDist;
          const baseR = 0.3 + edgeFade * 1.2 + ringWave * 0.8;
          const r = Math.max(0.2, Math.min(baseR + mouseInfluence * 2, GRID * 0.42));

          const alpha = 0.03 + edgeFade * 0.06 + ringWave * 0.04 + mouseInfluence * 0.15;

          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${INK[0]},${INK[1]},${INK[2]},${Math.min(alpha, 0.25)})`;
          ctx.fill();
        }
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    resize();
    draw();

    // ---- 3D ORBIT BLUR EFFECT ----
    // Words blur when they pass behind the glass front panel (negative Z)
    const orbitWords = document.querySelectorAll('.orbit-word');
    const orbitContainer = document.querySelector('.orbit-container');

    function updateOrbitBlur() {
      const style = getComputedStyle(orbitContainer);
      const transform = style.transform;

      // Extract rotation angle from the transform matrix
      let angle = 0;
      if (transform && transform !== 'none') {
        const values = transform.split('(')[1].split(')')[0].split(',');
        const a = parseFloat(values[0]);
        const b = parseFloat(values[1]);
        angle = Math.atan2(b, a);
      }

      orbitWords.forEach((word, i) => {
        // Each word is spaced 45deg apart
        const wordAngle = angle + (i * Math.PI * 2 / 8);
        // Z position: cos determines front vs back
        const z = Math.cos(wordAngle);

        if (z < -0.1) {
          // Behind the front glass panel — apply blur
          const blurAmount = Math.abs(z) * 6;
          word.style.filter = `blur(${blurAmount}px)`;
          word.style.opacity = 0.3 + (1 + z) * 0.4;
        } else {
          // In front — sharp and clear
          word.style.filter = 'blur(0px)';
          word.style.opacity = 0.5 + z * 0.5;
        }
      });

      requestAnimationFrame(updateOrbitBlur);
    }

    updateOrbitBlur();

    // ---- CIPHER DECODE EFFECT ----
    (function cipherDecode() {
      const el = document.getElementById('cipherText');
      const finalText = el.getAttribute('data-text');
      const glyphs = '&#%@$!?*+=/\\|~<>[]{}0123456789';
      const len = finalText.length;
      let revealed = 0;

      function scrambleRemaining() {
        let html = '';
        for (let i = 0; i < len; i++) {
          if (finalText[i] === ' ') {
            html += ' ';
          } else if (i < revealed) {
            const boldStart = finalText.indexOf('story, strategy & content');
            const boldEnd = boldStart + 'story, strategy & content'.length;
            if (i >= boldStart && i < boldEnd) {
              if (i === boldStart) html += '<strong>';
              html += finalText[i];
              if (i === boldEnd - 1) html += '</strong>';
            } else {
              html += finalText[i];
            }
          } else {
            html += '<span class="cipher-char">' + glyphs[Math.floor(Math.random() * glyphs.length)] + '</span>';
          }
        }
        el.innerHTML = html;
      }

      setTimeout(() => {
        const interval = setInterval(() => {
          revealed += 1 + Math.floor(Math.random() * 2);
          if (revealed >= len) {
            revealed = len;
            clearInterval(interval);
            el.innerHTML = 'We craft the <strong>story, strategy & content</strong> that sells homes before the first key is handed over.';
          }
          scrambleRemaining();
        }, 40);
        scrambleRemaining();
      }, 1200);
    })();
  </script>
