<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before Keys — Next-Gen Social Agency for New Build Real Estate</title>
  <meta name="description" content="Before Keys — a next-gen social agency for new build real estate projects. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1ec;
      --ink: #1a1a18;
      --ink-light: #3a3a36;
      --ink-mid: #6a6a64;
      --ink-faint: #b0ada6;
    }

    html, body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ---- HALFTONE CANVAS ---- */
    canvas#halftone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ---- MAIN CONTENT ---- */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px 24px;
      text-align: center;
    }

    /* ---- EMBLEM: orbiting text ring + 3D spinning key ---- */
    .emblem {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 48px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.2s;
    }

    /* Orbiting circular text */
    .orbit-text {
      position: absolute;
      inset: 0;
      animation: orbitSpin 20s linear infinite;
    }

    .orbit-text text {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      fill: var(--ink);
    }

    @keyframes orbitSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Dot ring around the orbit */
    .dot-ring {
      position: absolute;
      inset: 20px;
      animation: orbitDots 30s linear infinite reverse;
    }

    /* Key icon centered inside emblem */
    .key-icon-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      perspective: 600px;
    }

    .key-icon {
      width: 140px;
      height: 140px;
      animation: spin3d 4s linear infinite;
      transform-style: preserve-3d;
    }

    @keyframes spin3d {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    @keyframes orbitDots {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---- BRAND ---- */
    .brand {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 8px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.4s;
      position: relative;
    }

    .brand::after {
      content: '';
      display: block;
      width: 100%;
      height: 3px;
      margin-top: 6px;
      background: repeating-linear-gradient(
        to right,
        var(--ink) 0px, var(--ink) 3px,
        transparent 3px, transparent 6px
      );
    }

    /* ---- TAGLINE ---- */
    .tagline {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: clamp(0.55rem, 1.4vw, 0.72rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: 48px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.6s;
    }

    /* ---- HALFTONE DIVIDER ---- */
    .halftone-divider {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 48px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.7s;
    }

    .halftone-divider span {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink);
    }

    .halftone-divider span:nth-child(1) { opacity: 0.15; width: 3px; height: 3px; }
    .halftone-divider span:nth-child(2) { opacity: 0.25; width: 3px; height: 3px; }
    .halftone-divider span:nth-child(3) { opacity: 0.35; }
    .halftone-divider span:nth-child(4) { opacity: 0.5; }
    .halftone-divider span:nth-child(5) { opacity: 0.65; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(6) { opacity: 0.8; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(7) { opacity: 1; width: 6px; height: 6px; }
    .halftone-divider span:nth-child(8) { opacity: 0.8; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(9) { opacity: 0.65; width: 5px; height: 5px; }
    .halftone-divider span:nth-child(10) { opacity: 0.5; }
    .halftone-divider span:nth-child(11) { opacity: 0.35; }
    .halftone-divider span:nth-child(12) { opacity: 0.25; width: 3px; height: 3px; }
    .halftone-divider span:nth-child(13) { opacity: 0.15; width: 3px; height: 3px; }

    /* ---- DESCRIPTION (cipher decode) ---- */
    .description {
      font-size: clamp(0.88rem, 2vw, 1.05rem);
      font-weight: 300;
      line-height: 1.7;
      color: var(--ink-light);
      max-width: 420px;
      margin-bottom: 48px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 0.85s;
    }

    .description strong {
      font-weight: 500;
      color: var(--ink);
    }

    .cipher-char {
      display: inline-block;
      min-width: 0.25em;
    }

    /* ---- UNDER CONSTRUCTION — glitch scanner ---- */
    .construction-wrap {
      position: relative;
      margin-bottom: 48px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1s;
    }

    .construction {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 36px;
      border: 1.5px solid var(--ink);
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .construction::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(26, 26, 24, 0.06) 40%,
        rgba(26, 26, 24, 0.12) 50%,
        rgba(26, 26, 24, 0.06) 60%,
        transparent 100%
      );
      animation: scanLine 3s ease-in-out infinite;
    }

    @keyframes scanLine {
      0%   { left: -100%; }
      100% { left: 100%; }
    }

    .construction .corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--ink);
      border-style: solid;
      border-width: 0;
    }

    .construction .corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
    .construction .corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
    .construction .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
    .construction .corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

    .construction .cursor-block {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--ink);
      animation: cursorBlink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .construction-dots {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .construction-dots.left { right: calc(100% + 12px); }
    .construction-dots.right { left: calc(100% + 12px); }

    .construction-dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink);
    }

    .construction-dots span:nth-child(1) { opacity: 0.15; }
    .construction-dots span:nth-child(2) { opacity: 0.4; }
    .construction-dots span:nth-child(3) { opacity: 0.7; }
    .construction-dots span:nth-child(4) { opacity: 0.4; }
    .construction-dots span:nth-child(5) { opacity: 0.15; }

    /* ---- PIXEL GRID DECORATION ---- */
    .pixel-row {
      display: flex;
      gap: 3px;
      margin-bottom: 48px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1.1s;
    }

    .pixel-row .px {
      width: 8px;
      height: 8px;
      background: var(--ink);
    }

    .pixel-row .px:nth-child(odd) { opacity: 0.3; }
    .pixel-row .px:nth-child(even) { opacity: 0.7; }
    .pixel-row .px:nth-child(4) { opacity: 1; }

    /* ---- CONTACT ---- */
    .contact {
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1.2s;
    }

    .contact a {
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 3px;
      transition: opacity 0.3s ease;
    }

    .contact a:hover {
      opacity: 0.6;
    }

    /* ---- FOOTER DOTS ---- */
    .footer-dots {
      margin-top: 48px;
      display: flex;
      gap: 8px;
      opacity: 0;
      animation: dotFadeIn 0.8s ease forwards 1.35s;
    }

    .footer-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.2;
    }

    .footer-dots span:nth-child(2) { opacity: 0.35; }
    .footer-dots span:nth-child(3) { opacity: 0.5; animation: blink 3s ease-in-out infinite; }
    .footer-dots span:nth-child(4) { opacity: 0.35; }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes dotFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---- MOBILE ---- */
    @media (max-width: 520px) {
      .page {
        padding: 36px 16px;
        gap: 0;
      }

      .emblem {
        width: 240px;
        height: 240px;
        margin-bottom: 32px;
      }

      .key-icon {
        width: 140px;
        height: 140px;
      }

      .orbit-text text {
        font-size: 9px;
      }

      .brand {
        font-size: 1.8rem;
        margin-bottom: 6px;
      }

      .tagline {
        font-size: 0.5rem;
        letter-spacing: 0.2em;
        margin-bottom: 28px;
      }

      .halftone-divider {
        margin-bottom: 28px;
      }

      .description {
        font-size: 0.85rem;
        margin-bottom: 32px;
        padding: 0 4px;
      }

      .construction-wrap {
        margin-bottom: 32px;
      }

      .construction {
        padding: 12px 20px;
        font-size: 0.58rem;
        letter-spacing: 0.16em;
      }

      .construction-dots { display: none; }

      .pixel-row {
        margin-bottom: 32px;
      }

      .footer-dots {
        margin-top: 32px;
      }
    }
  </style>
</head>

  <script>
    // ---- HALFTONE DOT BACKGROUND ----
    const canvas = document.getElementById('halftone');
    const ctx = canvas.getContext('2d');
    let w, h, cols, rows;
    const GRID = 18;
    const INK = [26, 26, 24];
    let mouse = { x: -1000, y: -1000 };
    let time = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(w / GRID) + 1;
      rows = Math.ceil(h / GRID) + 1;
    }

    function draw() {
      time += 0.003;
      ctx.clearRect(0, 0, w, h);

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * GRID;
          const y = row * GRID;

          const cx = w / 2;
          const cy = h / 2;
          const dx = x - cx;
          const dy = y - cy;
          const distCenter = Math.sqrt(dx * dx + dy * dy);
          const maxDist = Math.sqrt(cx * cx + cy * cy);

          const ringPhase = distCenter * 0.02 + time;
          const ringWave = Math.sin(ringPhase) * 0.5 + 0.5;

          const mdx = x - mouse.x;
          const mdy = y - mouse.y;
          const mouseDist = Math.sqrt(mdx * mdx + mdy * mdy);
          const mouseInfluence = Math.max(0, 1 - mouseDist / 150);

          const edgeFade = distCenter / maxDist;
          const baseR = 0.3 + edgeFade * 1.2 + ringWave * 0.8;
          const r = Math.max(0.2, Math.min(baseR + mouseInfluence * 2, GRID * 0.42));

          const alpha = 0.03 + edgeFade * 0.06 + ringWave * 0.04 + mouseInfluence * 0.15;

          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${INK[0]},${INK[1]},${INK[2]},${Math.min(alpha, 0.25)})`;
          ctx.fill();
        }
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    resize();
    draw();

    // ---- CIPHER DECODE EFFECT ----
    // Text decodes from scrambled glyphs like unlocking a cipher — on brand with "keys"
    (function cipherDecode() {
      const el = document.getElementById('cipherText');
      const finalText = el.getAttribute('data-text');
      const glyphs = '&#%@$!?*+=/\\|~<>[]{}0123456789';
      const len = finalText.length;
      let revealed = 0;

      function scrambleRemaining() {
        let html = '';
        for (let i = 0; i < len; i++) {
          if (finalText[i] === ' ') {
            html += ' ';
          } else if (i < revealed) {
            // Check if this is part of "story, strategy & content" for bold
            const boldStart = finalText.indexOf('story, strategy & content');
            const boldEnd = boldStart + 'story, strategy & content'.length;
            if (i >= boldStart && i < boldEnd) {
              if (i === boldStart) html += '<strong>';
              html += finalText[i];
              if (i === boldEnd - 1) html += '</strong>';
            } else {
              html += finalText[i];
            }
          } else {
            html += '<span class="cipher-char">' + glyphs[Math.floor(Math.random() * glyphs.length)] + '</span>';
          }
        }
        el.innerHTML = html;
      }

      // Wait for fade-in, then start decoding
      setTimeout(() => {
        const interval = setInterval(() => {
          revealed += 1 + Math.floor(Math.random() * 2);
          if (revealed >= len) {
            revealed = len;
            clearInterval(interval);
            // Restore final HTML with bold
            el.innerHTML = 'We craft the <strong>story, strategy & content</strong> that sells homes before the first key is handed over.';
          }
          scrambleRemaining();
        }, 40);

        // Initial scramble
        scrambleRemaining();
      }, 1200);
    })();
  </script>
</body>
